name: Feature request
description: Something the client should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The problem you are trying to solve, and the API call or behavior you would like.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Any workaround you use now.
